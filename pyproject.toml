[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "k4n0n3"
version = "0.2.0"
description = "Zero-Flush Memory Management for LLMs — transparent CPU/GPU layer offloading"
authors = [{name = "opencode"}]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "psutil>=5.9.0",
    "safetensors>=0.4",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
gguf = ["gguf>=0.10"]
accelerate = ["accelerate>=0.20"]
dev = ["pytest", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/jnrabit/K4N0N3"
Repository = "https://github.com/jnrabit/K4N0N3.git"

[project.scripts]
k4n0n3 = "k4n0n3.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["k4n0n3*"]
